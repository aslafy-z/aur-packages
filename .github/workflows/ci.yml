name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate matrix
        id: gen-matrix
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        # Scheduled and manual runs pass no base ref, so they build everything.
        # That is the point of the weekly run: catching upstream breakage in
        # packages nobody has touched, and retrying any publish that failed.
        run: |
          case "$EVENT" in
              pull_request) base="origin/$PR_BASE" ;;
              push) base="$PUSH_BEFORE" ;;
              *) base="" ;;
          esac
          echo "packages=$(scripts/changed-packages.sh "$base")" >> "$GITHUB_OUTPUT"
    outputs:
      packages: ${{ steps.gen-matrix.outputs.packages }}

  aur:
    runs-on: ubuntu-latest
    needs: generate-matrix
    # An empty matrix vector fails the workflow instead of skipping the job, and
    # a change touching no package at all leaves nothing to build.
    if: needs.generate-matrix.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        pkgname: ${{ fromJson(needs.generate-matrix.outputs.packages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Builds and namcap-validates the package, then copies only PKGBUILD and the
      # regenerated .SRCINFO back into the workspace. The built package itself stays
      # in the action's container, so there is nothing to upload or clean up here.
      - name: Build and check package
        uses: heyhusen/archlinux-package-action@3f7aaada28c782497bfe02d6d6ea365b25fdea12 # v3.0.1
        with:
          path: packages/${{ matrix.pkgname }}
          namcap: true
          srcinfo: true

      - name: Read package commit message
        id: message
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "text<<PKGMSG_EOF"
            git log -n1 --pretty='%B' -- "packages/${{ matrix.pkgname }}"
            echo "PKGMSG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Publishing is restricted to the default branch. Without this guard every
      # push to any branch, including bot-authored upgrade branches, would ship
      # straight to the AUR without review.
      - name: Publish to AUR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkgname }}
          asset_dir: packages/${{ matrix.pkgname }}
          commit_username: "GitHub Action"
          commit_email: action@github.com
          ssh_private_key: ${{ secrets.SSH_KEY }}
          commit_message: |
            Update from GitHub Actions: ${{ steps.message.outputs.text }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
