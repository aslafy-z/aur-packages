name: Renovate

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run without creating branches or pull requests"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: debug
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate must not authenticate as GITHUB_TOKEN: pull requests opened with
      # it do not trigger other workflows, so upgrade PRs would carry no build or
      # namcap checks.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Renovate clones the repository itself; this checkout exists only so the
      # global config file is present on the runner for the container bind-mount.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: .github/renovate-global.json5
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
