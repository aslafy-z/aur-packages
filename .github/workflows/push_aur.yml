name: "Update AUR"

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate matrix
        id: gen-matrix
        run: echo "packages=$(ls */ -d | cut -f1 -d'/' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
    outputs:
      packages: ${{ steps.gen-matrix.outputs.packages }}

  aur:
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        pkgname: ${{ fromJson(needs.generate-matrix.outputs.packages) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and check package
        uses: heyhusen/archlinux-package-action@v3.0.1
        with:
          path: ${{ matrix.pkgname }}
          namcap: true
          srcinfo: true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkgname }}-${{ github.run_id }}
          path: ${{ matrix.pkgname }}/*.pkg.tar*

      # asset_dir mirrors the whole package directory into the AUR repository and
      # only honours a .gitignore inside that directory, not the one at the
      # repository root. Without this the build output would be pushed to the AUR.
      - name: Drop build output before publishing
        run: sudo rm -rf "${{ matrix.pkgname }}"/{pkg,src} "${{ matrix.pkgname }}"/*.pkg.tar*

      - name: Read package commit message
        id: message
        run: |
          {
            echo "text<<PKGMSG_EOF"
            git log -n1 --pretty='%B' -- "${{ matrix.pkgname }}"
            echo "PKGMSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.pkgname }}
          asset_dir: ${{ matrix.pkgname }}
          commit_username: "GitHub Action"
          commit_email: action@github.com
          ssh_private_key: ${{ secrets.SSH_KEY }}
          commit_message: |
            Update from GitHub Actions: ${{ steps.message.outputs.text }}

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
